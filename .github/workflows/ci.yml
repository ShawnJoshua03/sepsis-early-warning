name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image and smoke-test it
        run: |
          docker build -t sepsis-ew .
          docker run -d --name app -p 7860:7860 sepsis-ew
          for i in $(seq 1 30); do curl -sf localhost:7860/health && break; sleep 1; done
          curl -sf localhost:7860/health
          curl -sf localhost:7860/ | grep -q "Sepsis Early Warning"
